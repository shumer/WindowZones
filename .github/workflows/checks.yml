name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPECTED_SDK: '26.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.
      - name: Verify pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(xcrun --show-sdk-version)" = "$EXPECTED_SDK"
          xcodebuild -version
          swift --version
      - name: Tests
        run: ./scripts/test.sh
      - name: Build and verify inspection app
        run: ./scripts/build.sh
      - name: Archive inspection app
        run: ditto -c -k --sequesterRsrc --keepParent build/WindowZones.app build/WindowZones-inspection.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1.
        with:
          name: WindowZones-inspection-only
          path: build/WindowZones-inspection.zip
          retention-days: 7
