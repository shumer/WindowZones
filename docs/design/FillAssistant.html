<!doctype html><html lang="ru"><meta charset="utf-8"><title>WindowZones: заполнение зон</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8edf4;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#232730;padding:40px}main{max-width:960px;margin:auto}h1{font-size:26px}p{color:#626c7d;line-height:1.6}.desktop{padding:14px;background:linear-gradient(135deg,#b5cfce,#8fadd3);border-radius:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px;height:520px}.zone{border:2px solid transparent;border-radius:14px;background:#ffffffb8;padding:20px;box-shadow:0 6px 20px #20304712}.zone.active{border-color:#087df1;background:#fffffff2}.zone.filled{background:#fafbfc}.label{font-size:13px;color:#667080;margin-bottom:18px}.apps{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid #d1d5dc;border-radius:9px;background:white;padding:12px;cursor:pointer;font:inherit}button:hover{background:#e9f3ff}footer{display:flex;gap:12px;margin-top:18px}.hint{font-size:13px}
</style><main><h1>Одно окно размещено. Соберём остальные?</h1><p>Выбери свободную зону, затем окно. В приложении здесь будут миниатюры при наличии разрешения или иконки с названиями. Это интерактивный макет, он не перемещает реальные окна.</p><div class="desktop" id="desk"></div><footer><button onclick="skip()">Пропустить</button><button onclick="finish()">Готово / Escape</button><button onclick="reset()">Повторить</button></footer><p class="hint" id="hint"></p></main><script>
let used,selected,skipped,stopped;const names=['Safari','Slack','Заметки'];function reset(){used=['Finder',null,null,null];selected=1;skipped=[];stopped=false;render()}function next(){selected=used.findIndex((x,i)=>!x&&!skipped.includes(i));if(selected<0)stopped=true;render()}function skip(){skipped.push(selected);next()}function finish(){stopped=true;render()}function choose(n){used[selected]=n;next()}function render(){document.querySelector('#desk').replaceChildren();used.forEach((name,i)=>{let z=document.createElement('section');z.className='zone '+(name?'filled':i===selected&&!stopped?'active':'');let label=document.createElement('div');label.className='label';label.textContent='Зона '+(i+1);z.append(label);if(name){let h=document.createElement('h2');h.textContent=name;z.append(h)}else if(!stopped&&i===selected){let h=document.createElement('h3');h.textContent='Выбери окно';z.append(h);let apps=document.createElement('div');apps.className='apps';names.filter(n=>!used.includes(n)).forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=e=>{e.stopPropagation();choose(n)};apps.append(b)});z.append(apps)}else{let b=document.createElement('button');b.textContent='Заполнить эту зону';b.disabled=stopped;b.onclick=()=>{selected=i;skipped=skipped.filter(x=>x!==i);render()};z.append(b)}document.querySelector('#desk').append(z)});document.querySelector('#hint').textContent=stopped?'Выбор завершён. Уже размещённые окна остаются на месте.':'Окно перемещается только после выбора. Зону можно пропустить.'}document.addEventListener('keydown',e=>{if(e.key==='Escape')finish()});reset();
</script></html>
